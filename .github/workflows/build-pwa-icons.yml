name: Build PWA icons

on:
  push:
    paths:
      - ".github/workflows/build-pwa-icons.yml"

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate PWA icons
        run: |
          if command -v magick >/dev/null 2>&1; then
            IMG=magick
          else
            IMG=convert
          fi
          $IMG logo.png -trim -resize "96%x96%" -gravity center -background none -extent 512x512 icon-512.png
          $IMG logo.png -trim -resize "96%x96%" -gravity center -background none -extent 192x192 icon-192.png

      - name: Commit icons and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/build-pwa-icons.yml
          git add icon-192.png icon-512.png .github/workflows/build-pwa-icons.yml
          git commit -m "Add PWA icons" || exit 0
          git push
