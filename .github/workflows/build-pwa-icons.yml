name: Build PWA icons

on:
  push:
    paths:
      - ".github/workflows/build-pwa-icons.yml"

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Generate PWA icons
        run: |
          convert logo.png -trim -resize "96%x96%" -gravity center -background none -extent 512x512 PNG32:icon-512.png
          convert logo.png -trim -resize "96%x96%" -gravity center -background none -extent 192x192 PNG32:icon-192.png

      - name: Commit icons and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/build-pwa-icons.yml
          git add icon-192.png icon-512.png .github/workflows/build-pwa-icons.yml
          git commit -m "Add PWA icons" || exit 0
          git push
